<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Name Picker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            background: rgba(252, 251, 251, 0.95);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        h1 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 1.5rem;
            font-size: 2.5rem;
        }

        .input-section {
            margin-bottom: 2rem;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 1rem;
            border: 2px solid #648abb;
            border-radius: 8px;
            resize: vertical;
            font-size: 1rem;
            margin-bottom: 1rem;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 6px;
            background: #667eea;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.3s ease;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .result {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            color: #153a7c;
            min-height: 60px;
            padding: 1rem;
            background: #ffffff;
            border-radius: 8px;
            margin-top: 1rem;
            transition: opacity 0.3s ease;
        }

        .spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .admin-section {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #3f4a5d;
        }

        .admin-section a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .admin-section a:hover {
            color: #764ba2;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Random Name Picker</h1>
        
        <div class="input-section">
            <textarea 
                id="namesInput" 
                placeholder="Enter names, each on a new line..."
                autofocus
            ></textarea>
        </div>

        <div class="buttons">
            <button onclick="handlePickRandomName()">Pick Random Name</button>
            <button onclick="clearAll()">Clear</button>
        </div>

        <div id="result" class="result"></div>
        <audio id="clickSound" src="click.mp3"></audio>

        <!-- Admin Section -->
        <div class="admin-section">
            <p>Admin: <a href="https://www.facebook.com/share/15ovQ26Pv7/" target="_blank">SOPHA PANHA</a></p>
        </div>
    </div>
    <script>
        function handlePickRandomName() {
            // Play the click sound
            const clickSound = document.getElementById('clickSound');
            clickSound.play();

            // Disable the button to prevent multiple clicks
            const pickButton = document.querySelector('.buttons button:first-child');
            pickButton.disabled = true;

            // Start the lucky draw animation
            startLuckyDrawAnimation();

            // Add a 5-second delay before picking a random name
            setTimeout(() => {
                stopLuckyDrawAnimation();
                pickRandomName();
                // Re-enable the button after the delay
                pickButton.disabled = false;
            }, 6000); // 5 seconds = 5000 milliseconds
        }

        function startLuckyDrawAnimation() {
            const names = getNamesArray();
            const resultDiv = document.getElementById('result');

            if (names.length === 0) {
                resultDiv.textContent = 'Please enter some names first!';
                resultDiv.style.color = '#e53e3e';
                return;
            }

            // Function to update the displayed name rapidly
            let animationInterval;
            let startTime = Date.now();

            const animateNames = () => {
                const randomIndex = Math.floor(Math.random() * names.length);
                resultDiv.textContent = names[randomIndex];
            };

            // Start the animation
            animationInterval = setInterval(animateNames, 100); // Update every 100ms

            // Store the interval ID so we can stop it later
            resultDiv.dataset.animationInterval = animationInterval;
        }

        function stopLuckyDrawAnimation() {
            const resultDiv = document.getElementById('result');
            const animationInterval = resultDiv.dataset.animationInterval;

            // Stop the animation
            if (animationInterval) {
                clearInterval(animationInterval);
            }
        }

        function pickRandomName() {
            const names = getNamesArray();
            const resultDiv = document.getElementById('result');
            
            if (names.length === 0) {
                resultDiv.textContent = 'Please enter some names first!';
                resultDiv.style.color = '#e53e3e';
                return;
            }
            resultDiv.style.color = '#2d3748';

            // Pick a random name
            const randomIndex = Math.floor(Math.random() * names.length);
            resultDiv.textContent = names[randomIndex];
            addConfettiEffect();
        }

        function clearAll() {
            document.getElementById('namesInput').value = '';
            document.getElementById('result').textContent = '';
        }

        function getNamesArray() {
            const names = document.getElementById('namesInput').value;
            return names.split('\n')
                       .map(name => name.trim())
                       .filter(name => name.length > 0);
        }

        function addConfettiEffect() {
            // Simple confetti effect using emojis
            const confetti = ['🎉', '🎊', '✨', '🌟'];
            const resultDiv = document.getElementById('result');
            
            confetti.forEach((emoji, index) => {
                setTimeout(() => {
                    resultDiv.textContent += `${emoji}`;
                }, index * 100);
            });
        }
    </script>
</body>
</html>
